[project]
name = "kovalo-copilot"
version = "0.1.0"
description = "Kovalo Decision Copilot: asystent decyzji cenowych (LangChain + LangGraph + MCP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.7,<2",
    "langgraph>=1.2,<2",
    "langchain-google-genai>=4.4,<5",
    "pydantic>=2.10,<3",
    "pydantic-settings[yaml]>=2.7,<3",
    "pyyaml>=6",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "chainlit>=2,<3",
    "mcp>=1.10,<2",
    "psycopg[binary]>=3.2,<4",
    # F1 (wiedza)
    "fastembed>=0.9,<0.10",
    "langchain-postgres>=0.0.19,<0.1",
    "langchain-classic>=1.0,<2",
    "langchain-text-splitters>=1.1,<2",
    "tiktoken>=0.12,<1",
    "numpy>=2,<3",
]

[project.optional-dependencies]
# Opcjonalny tryb zgodny z kursem (OpenAI): uv sync --extra openai
openai = ["langchain-openai>=1.0,<2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio",
    "ruff",
    "mypy",
    "pre-commit",
    "types-PyYAML",
]

[project.scripts]
kovalo = "kovalo.cli:entrypoint"
kovalo-api = "kovalo.api.main:run"
kovalo-ui = "kovalo.ui.server:run"
kovalo-mcp = "kovalo.mcp_server.server:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kovalo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["reference", "data", "reports", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["kovalo"]
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: wywołuje prawdziwe API LLM-a (wymaga GOOGLE_API_KEY); uruchamiane ręcznie",
  "integration: wymaga działającego docker compose (Postgres na localhost:5432)",
  "model: wymaga pobranego modelu fastembed (0,2-2,3 GB); uruchamiane ręcznie",
]
addopts = "-m 'not live and not integration and not model'"

[tool.uv]
# cryptography >=47 kończy się SIGILL na Apple Silicon z SVE/SME (Docker Desktop, linuxkit);
# 46.x działa. onnxruntime >=1.23 (kernele SME/KleidiAI) kończy się SIGILL w tym samym środowisku;
# 1.22.x działa. Usunąć po naprawie upstream (docs/04-tech-stack.md).
constraint-dependencies = ["cryptography>=46,<47", "onnxruntime>=1.20,<1.23"]
