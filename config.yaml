# Kovalo Decision Copilot – konfiguracja projektu.
#
# Nie zmieniaj wartości oznaczonych PINNED: zależą od nich testy i dołączona pamięć
# podręczna (ang. cache) reprezentacji wektorowych tekstu (ang. embeddings).
# Ścieżki są podawane względem folderu zawierającego ten plik.

paths:
  corpus_dir: data/corpus
  corpus_catalog: data/corpus/catalog.csv   # metadane: jeden wiersz na dokument
  eval_queries: data/eval/mini_project_1_queries.yaml
  embedding_cache: data/embeddings/cache      # LocalFileStore z LangChain, dostarczony z kursem
  mini_project_1_output_dir: reports/mp1
  mini_project_2_questions: data/eval/mini_project_2_questions.yaml
  mini_project_2_output_dir: reports/mp2
  mini_project_3_dialogues: data/eval/mini_project_3_dialogues.yaml
  mini_project_3_output_dir: reports/mp3
  company_data_dir: data/company              # dane firmy Kovalo (stan na konkretny dzień, tylko do odczytu)
  mini_project_4_questions: data/eval/mini_project_4_questions.yaml
  mini_project_4_output_dir: reports/mp4
  mini_project_5_conversations: data/eval/mini_project_5_conversations.yaml
  mini_project_5_output_dir: reports/mp5
  llm_cache_dir: .cache/llm         # NASZE (ADR-0008): cache odpowiedzi LLM-a w ewaluacjach (JSON na dysku)

corpus:
  required_metadata: [doc_id, title, doc_type, department, owner, effective_date, language]

tokenizer:
  encoding: o200k_base            # PINNED – tokenizer modeli z rodzin GPT-4o i GPT-5

chunking:
  chunk_size: 800                 # PINNED – w znakach
  chunk_overlap: 120              # PINNED – w znakach
  separators: ["\n\n", "\n", ". ", " ", ""]   # PINNED – próbowane w tej kolejności

embeddings:
  model: text-embedding-3-small   # PINNED
  dimensions: 1536                # PINNED
  batch_size: 64
  provider: fastembed             # NASZE (ADR-0003): fastembed | openai_cache
  local:                          # NASZE: model używany przez ingest, wyszukiwanie i E1 (ostateczny wybór po E1)
    model: intfloat/multilingual-e5-large
    dimensions: 1024
    query_prefix: "query: "       # E5 wymaga prefiksów (ADR-0007)
    passage_prefix: "passage: "
    threads: null                 # null = domyślne onnxruntime
    local_files_only: false       # true w compose (model wbudowany w obraz, bez pobierania)
    models_dir: .cache/fastembed  # pobrane modele ONNX (w obrazie: wypełnione przy budowaniu)
    cache_dir: .cache/embeddings  # CacheBackedEmbeddings; data/ jest tylko do odczytu
  candidates:                     # NASZE: modele porównywane w E1 (ADR-0007); local.model jest dodawany zawsze
    - {model: intfloat/multilingual-e5-large, dimensions: 1024, query_prefix: "query: ", passage_prefix: "passage: "}
    - {model: jinaai/jina-embeddings-v3, dimensions: 1024}   # zadania retrieval.query/passage przez fastembed; licencja CC BY-NC 4.0
    - {model: sentence-transformers/paraphrase-multilingual-mpnet-base-v2, dimensions: 768}
    - {model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2, dimensions: 384}

retrieval:
  top_k: 3                        # PINNED
  mode: vector                    # NASZE (ADR-0008): vector | hybrid; vector wybrany po E2 (pytanie U2, R1 F2)
  hybrid:                         # NASZE: BM25 + wektory, fuzja Reciprocal Rank Fusion
    fetch_k: 10                   # kandydaci z każdej listy przed fuzją (≥ top_k)
    rrf_c: 60                     # stała RRF (jak domyślna w EnsembleRetriever)
    weights: {vector: 0.5, bm25: 0.5}
    bm25: {k1: 1.5, b: 0.75, epsilon: 0.25}   # domyślne rank_bm25.BM25Okapi

reference_llm:
  # PINNED – LLM, z którym projekt jest budowany i sprawdzany: używają go przebiegi
  # referencyjne, testy na żywo i koszty podane w README.
  provider: openai
  model: gpt-5.4-mini

llm:
  # NASZE (ADR-0002, ADR-0006). Nazwy modeli są tylko tutaj, nigdy w kodzie.
  provider: google_genai          # google_genai | openai (opcjonalny, extra `openai`)
  model: gemini-3.5-flash-lite    # stabilna wersja; Flash (3.5/3.6) ma w darmowym tierze tylko 20 zapytań/dzień (ADR-0006, aneks 2026-11-02)
  temperature: null               # null = domyślna dostawcy (Gemini 3: 1.0, zalecenie Google)
  max_retries: 1                  # 1 = bez ponowień w SDK Google; po timeoucie od razu fallback (ADR-0006)
  timeout_s: 60
  params:                         # przekazywane 1:1 jako kwargs do init_chat_model (także fallbackom)
    thinking_level: low           # Gemini 3: minimal | low | medium | high; obsługiwane przez 3.5 Flash-Lite (domyślnie minimal) i 3.6 Flash (domyślnie medium)
  rate_limit:                     # InMemoryRateLimiter, osobny na każdy model w procesie
    requests_per_second: 0.25     # ok. 15 zapytań/min
    check_every_n_seconds: 0.1
    max_bucket_size: 1            # bez serii zapytań
  fallbacks:                      # w tej kolejności; każdy ma własny limiter
    - provider: google_genai
      model: gemini-3.6-flash     # tylko awaryjnie: 20 zapytań/dzień w darmowym tierze
      rate_limit: {requests_per_second: 0.15, check_every_n_seconds: 0.1, max_bucket_size: 1}
  purposes: {}                    # opcjonalne nadpisania per cel, np. answer: {params: {thinking_level: minimal}}; judge: {model: …} (pytania U3, U5)

cost:
  # Miesięczne oszacowanie zawsze liczy się według cen tego modelu, niezależnie od twojego LLM-a.
  reference_model: gpt-5.4-mini   # PINNED
  # Ceny z cennika OpenAI w USD za milion tokenów, październik 2026 r. Są przypięte, żeby
  # wyliczenia kosztów dało się powtórzyć; aktualne ceny sprawdzisz na stronie dostawcy.
  prices_per_1m_tokens:           # PINNED
    text-embedding-3-small: {input: 0.02, output: 0.0}
    gpt-5.4-mini: {input: 0.75, output: 4.50}
  scenario:                       # PINNED
    questions_per_day: 400
    working_days_per_month: 21
    output_tokens_per_answer: 350
  # NASZE (ADR-0007): drugi cennik w raportach. Płatny tier Gemini API (Standard), USD za 1M tokenów,
  # wyjście razem z tokenami myślenia. Darmowy tier = 0 USD.
  our_model: gemini-3.5-flash-lite   # model odpowiedzi (llm.model); koszt liczony według jego cen
  our_prices_checked_on: 2026-11-02
  our_prices_per_1m_tokens:
    gemini-3.6-flash: {input: 0.75, output: 3.75}       # do 2026-12-31; od 2027-01-01: 1.50 / 7.50
    gemini-3.5-flash-lite: {input: 0.30, output: 2.50}

policy:
  # PINNED – polityka rabatowa POL-001 jako dane, z kursową interpretacją „course-v1”
  # tego, czego tekst polityki nie rozstrzyga (zobacz mini_project_3/README.md).
  version: course-v1
  bands:                          # zwykłe przedziały akceptacji: rabat do limitu włącznie
    - {up_to: 5, roles: [Przedstawiciel handlowy]}
    - {up_to: 12, roles: [Regionalny kierownik sprzedaży]}
    - {up_to: 20, roles: [Dyrektor handlowy]}
    - {up_to: 100, roles: [CEO, CFO]}
  exceptions:                     # każdy obniża poziom uprawnień do `roles`, ale tylko do limitu `cap`
    clearance: {cap: 35, roles: [Regionalny kierownik sprzedaży]}
    strategic_account: {cap: 25, roles: [Dyrektor handlowy]}
    competitor_offer: {cap: 15, roles: [Regionalny kierownik sprzedaży]}
  margin_floor: 9                 # marża po rabacie PONIŻEJ tej wartości dodaje floor_role…
  floor_role: CFO                 # …chyba że towar to wyprzedaż końcówek

agent:
  # PINNED – Miniprojekt 4: jeden limit na pytanie, wspólny dla wszystkich agentów, którzy nad nim pracują
  max_steps: 24                   # tury modelu + wyniki narzędzi
  timeout_s: 180                  # sekundy, sprawdzane przed każdym krokiem (trwające wywołanie najpierw się kończy)

mcp:
  # PINNED – Miniprojekt 5: limity czasu połączenia z serwerem MCP Kovalo
  startup_timeout_s: 60           # serwer, który nie dokończy inicjalizacji, zostaje zamknięty
  call_timeout_s: 120             # dłuższe wywołanie narzędzia jest anulowane; połączenie nie jest wtedy używane ponownie
  cleanup_timeout_s: 10           # najpierw łagodne zamknięcie (SDK czeka 2 s, potem kończy, a w ostateczności wymusza zakończenie procesu)

prompts:
  system: |                       # PINNED
    Jesteś Kovalo Decision Copilot, asystentem kadry zarządzającej Kovalo Distribution.
    Odpowiadaj wyłącznie na podstawie wewnętrznych dokumentów podanych w kontekście.
    Przy każdym fakcie, z którego korzystasz, podaj identyfikator dokumentu. Jeśli
    dokumenty nie zawierają odpowiedzi, powiedz to wprost, zamiast zgadywać.
  answer_system: |                # PINNED – odpowiedzi Miniprojektu 2
    Jesteś Kovalo Decision Copilot, asystentem kadry zarządzającej Kovalo Distribution.
    Odpowiadaj wyłącznie na podstawie wewnętrznych dokumentów podanych w kontekście;
    każdy dokument zaczyna się od identyfikatora w nawiasach kwadratowych, np. [POL-001].
    Jako odwołania do źródeł wypisz identyfikatory dokumentów, z których korzystasz.
    Odpowiadaj w języku pytania, także gdy dokumenty w kontekście są w innym języku:
    na pytanie po polsku odpowiadaj po polsku. Liczby zapisuj po polsku (94,6%;
    7296,00 PLN). Jeśli dokumenty nie zawierają odpowiedzi, ustaw answerable na false
    i powiedz to wprost, zamiast zgadywać.
  understand_system: |            # PINNED – wywołanie „understand” w Miniprojekcie 3
    Czytasz najnowszą wiadomość menedżera, który rozmawia z copilotem decyzyjnym Kovalo,
    i ustalasz, jak ją obsłużyć. Uwzględnij wcześniejszą rozmowę, żeby zrozumieć
    pytania uzupełniające.
    kind:
      document_question – pyta, co mówią dokumenty Kovalo (polityki, umowy, notatki ze
                          spotkań, raporty), z wyjątkiem pytania, kto akceptuje rabat;
      policy_question   – pyta, kto zaakceptowałby rabat albo co mówią zasady rabatowe,
                          BEZ prośby o przesłanie rabatu do akceptacji;
      approval_request  – wprost prosi, żeby konkretny rabat przesłać do akceptacji,
                          zgłosić albo uzyskać na niego zgodę;
      other             – podziękowania, powitania, luźna rozmowa, wszystko inne.
    request_action: "new" – nowy wniosek o rabat (inne zamówienie, klient lub produkt);
      "update" – wiadomość zmienia omawiany rabat; "none" – w pozostałych przypadkach.
    standalone: wiadomość przepisana tak, żeby była zrozumiała bez wcześniejszej rozmowy.
    Pola rabatu: wypełniaj je tylko tym, co mówi menedżer, albo tym, co jasno wynika
    z wcześniejszej rozmowy. Flagi (clearance, strategic_account, competitor_offer):
    null, gdy wiadomość o nich nie wspomina; true albo false tylko wtedy, gdy wspomina.
  agent_system: |                 # PINNED – agent Miniprojektu 4
    Jesteś analitykiem Kovalo Decision Copilot i pracujesz dla kadry zarządzającej Kovalo.
    Korzystaj z narzędzi: search_documents do tego, co mówią dokumenty Kovalo (umowy,
    polityki, notatki ze spotkań, raporty); get_contract_terms do warunków umowy z dostawcą
    dotyczących miesięcznego OTIF; get_supplier_otif i get_invoice_value do danych liczbowych;
    calculate_otif_penalty do obliczania kar; check_discount_policy do ustalenia, kto musi
    zaakceptować rabat.
    Zasady:
    - Każda liczba w odpowiedzi musi pochodzić z wyniku narzędzia w tej rozmowie. Napisz, skąd
      pochodzi: z dokumentu (podaj jego identyfikator), z danych firmy albo z obliczenia.
    - Zanim uznasz, że kara jest należna, sprawdź warunki umowy z dostawcą: bez klauzuli
      o karze umownej kara nie przysługuje, niezależnie od OTIF.
    - Jeśli brakuje danych, napisz dokładnie, czego brakuje. Nigdy ich nie szacuj ani nie
      zastępuj założeniami.
    - Nie możesz niczego zaakceptować, przesłać ani obiecać. Gdy chodzi o akceptację, napisz,
      kto musi jej udzielić i że wniosek przechodzi przez proces akceptacji w Kovalo.
    - Odpowiadaj krótko, w języku pytania, także gdy dokumenty lub dane są w innym języku:
      na pytanie po polsku odpowiadaj po polsku. Liczby zapisuj po polsku (94,6%;
      7296,00 PLN; 18 240 000 groszy).
  assistant_understand_system: |  # PINNED – wywołanie „understand” w Miniprojekcie 5 (jak w Miniprojekcie 3, z danymi firmy)
    Czytasz najnowszą wiadomość menedżera, który rozmawia z copilotem decyzyjnym Kovalo,
    i ustalasz, jak ją obsłużyć. Uwzględnij wcześniejszą rozmowę, żeby zrozumieć
    pytania uzupełniające.
    kind:
      document_question – pyta, co mówią dokumenty lub dane firmy Kovalo (polityki, umowy,
                          notatki ze spotkań, raporty, OTIF dostawców, faktury, kary),
                          z wyjątkiem pytania, kto akceptuje rabat;
      policy_question   – pyta, kto zaakceptowałby rabat albo co mówią zasady rabatowe,
                          BEZ prośby o przesłanie rabatu do akceptacji;
      approval_request  – wprost prosi, żeby konkretny rabat przesłać do akceptacji,
                          zgłosić albo uzyskać na niego zgodę;
      other             – podziękowania, powitania, luźna rozmowa, wszystko inne.
    request_action: "new" – nowy wniosek o rabat (inne zamówienie, klient lub produkt);
      "update" – wiadomość zmienia omawiany rabat ALBO przesyła go ponownie („prześlij to”,
      „spróbuj jeszcze raz”, „te same warunki”); "none" – w pozostałych przypadkach.
    standalone: wiadomość przepisana tak, żeby była zrozumiała bez wcześniejszej rozmowy.
    Pola rabatu: wypełniaj je tylko tym, co mówi menedżer, albo tym, co jasno wynika
    z wcześniejszej rozmowy. Flagi (clearance, strategic_account, competitor_offer):
    null, gdy wiadomość o nich nie wspomina; true albo false tylko wtedy, gdy wspomina.
  judge_system: |                 # NASZE (ADR-0008), wersja 1. Kurs zostawia rubrykę sędziego studentowi (krok 4 MP2)
    Jesteś sędzią, który ocenia odpowiedzi Kovalo Decision Copilot. Dostajesz pytanie,
    kontekst (fragmenty dokumentów, które widział oceniany model), ocenianą odpowiedź
    i odpowiedź wzorcową.
    correct: true, jeśli oceniana odpowiedź podaje kluczowe fakty z odpowiedzi wzorcowej
    i żadnemu z nich nie przeczy. Dodatkowe szczegóły nie obniżają oceny, jeśli kontekst
    je potwierdza. Inne sformułowanie, odmiana słów, zapis liczb (94,6% i 94.6%) oraz
    równoważne nazwy stanowisk (CFO i dyrektor finansowy) nie są błędem. Zaprzeczenie
    faktu („nie CFO”) oznacza, że faktu brakuje.
    grounded: true, jeśli każde twierdzenie odpowiedzi wynika z kontekstu. Twierdzenie
    spoza kontekstu, nawet prawdziwe, oznacza false. Odpowiedź wzorcowa nie jest kontekstem.
    reason: jedno lub dwa zdania po polsku; wskaż brakujący fakt albo twierdzenie
    bez pokrycia w kontekście.

db:
  # NASZE (ADR-0006)
  host: localhost                 # w compose: KOVALO_DB__HOST=postgres
  port: 5432
  connect_timeout_s: 5
  pool_min_size: 1
  pool_max_size: 5
  vector_collection: kovalo_ctx       # tabele PGVectorStore (ADR-0007)
  vector_collection_mp1: kovalo_mp1
  index_meta_table: kovalo_index_meta # model i wymiar każdej tabeli indeksu

services:
  # NASZE (ADR-0006)
  api_port: 8080
  ui_port: 8000
  mcp_port: 8765
  api_url: http://localhost:8080          # w compose: KOVALO_SERVICES__API_URL=http://api:8080
  mcp_url: http://localhost:8765/mcp      # w compose: KOVALO_SERVICES__MCP_URL=http://mcp-server:8765/mcp
  health_timeout_s: 2
  ui_api_timeout_s: 180             # NASZE (ADR-0010): limit jednego żądania ui → api (tura z fallbackiem i limiterem)
  sse_ping_s: 15                    # NASZE (ADR-0012): komentarz „ping” w strumieniu SSE, gdy tura długo milczy

workflow:                           # NASZE (ADR-0009, ADR-0011)
  checkpointer: postgres            # postgres | memory (memory: lokalnie bez Postgresa; pauzy znikają po restarcie)
  max_message_chars: 4000           # dłuższa wiadomość → 422 w API, ValueError w serwisie
  answerer: agent                   # agent | rag: kto odpowiada na document_question w aplikacji (E3 zawsze rag)
  understand_prompt: assistant_understand_system   # understand_system | assistant_understand_system (E3 zawsze understand_system)

tools:                              # NASZE (ADR-0011, ADR-0013)
  variant: ours                     # course (6 narzędzi kursu) | ours (+ check_termination_condition)
  source: mcp                       # direct | mcp: skąd agent w aplikacji bierze narzędzia (E4 domyślnie direct, E5 zawsze mcp)
  mcp_transport: http               # http (services.mcp_url) | stdio (podproces kovalo-mcp): tylko przy source: mcp

mcp_server:                         # NASZE (ADR-0013)
  search: pgvector                  # pgvector | memory: wyszukiwanie w narzędziu search_documents serwera
                                    # (stdio dla Claude Code i Inspectora: --search memory, U6)

company:                            # NASZE (ADR-0011): warunki spoza contract_terms.yaml (data/ jest tylko do odczytu)
  termination_version: termination-v1
  termination_terms:                # klucz: supplier_id; wartości przepisane z tekstu umowy, sprawdzane testem
    SUP-114:
      source_doc_id: CON-101        # „jeśli OTIF przez trzy kolejne miesiące wynosi mniej niż 94%”
      otif_below_pct: 94            # warunek: OTIF < próg (94,0 NIE spełnia)
      consecutive_months: 3
      notice_days: 60               # „z 60-dniowym okresem wypowiedzenia”
